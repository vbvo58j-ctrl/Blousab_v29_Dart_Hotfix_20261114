name: blousab
description: تطبيق بلوساب للتواصل المحلي عبر Bluetooth Classic.
publish_to: 'none'
version: 1.0.4+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  permission_handler: ^12.0.0
  url_launcher: ^6.3.2
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_compress: ^3.1.3
  flutter_local_notifications: ^17.2.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  crypto: ^3.0.3
  image: ^4.2.0
  flutter_gemma: ^1.11.3
  flutter_gemma_mediapipe: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/blousab_reference_logo.png
    - assets/branding/blousab_b_mark.png
